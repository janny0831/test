<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裝置專屬 ID</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --accent: #5b8cff;
    --text: #eef1f8;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1c2030, #0b0d12 70%);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--text);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 40px 36px;
    width: min(90vw, 420px);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .label {
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .device-id {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
    word-break: break-all;
    background: rgba(91,140,255,0.08);
    border: 1px solid rgba(91,140,255,0.25);
    border-radius: 10px;
    padding: 16px 12px;
    margin-bottom: 16px;
    font-family: "SF Mono", Consolas, monospace;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }
  .name-display {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 18px;
  }
  .name-display.unknown {
    font-size: 16px;
    font-weight: 400;
    color: var(--muted);
  }
  .picker {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .picker.show { display: flex; }
  .picker-title {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .name-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .name-btn:hover {
    background: rgba(91,140,255,0.12);
    border-color: var(--accent);
  }
  .name-btn:active { transform: scale(0.98); }
  .none-btn {
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.15);
    color: var(--muted);
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .change-link {
    display: inline-block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
  }
  .hidden { display: none !important; }
  .copy-btn {
    margin-top: 18px;
    background: var(--accent);
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .copy-btn:hover { opacity: 0.85; }
  .copy-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="card">
  <div class="name-display hidden" id="nameDisplay"></div>

  <div class="picker" id="namePicker">
    <div class="picker-title">請選擇您的姓名（僅需選擇一次）</div>
    <div id="nameButtonList"></div>
    <button class="none-btn" onclick="skipName()">找不到我的名字，先跳過</button>
  </div>

  <div class="label">您的裝置 ID</div>
  <div class="device-id" id="deviceIdDisplay">產生中...</div>
  <button class="copy-btn" onclick="copyId()">複製 ID</button>
  <div class="hint">此 ID 會儲存在本機瀏覽器中，<br>只要不清除瀏覽器資料，每次開啟都會顯示相同 ID。</div>
  <div>
    <button class="change-link hidden" id="changeLink" onclick="resetName()">不是我 / 重新選擇</button>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "site_device_id_v1";
  const NAME_STORAGE_KEY = "site_assigned_name_v1";
  const SKIPPED_VALUE = "__SKIPPED__";

  // 名單：新增人員直接在這裡加一行即可
  // （左邊的 ID 只作為備用比對，主要仍是靠使用者「選一次」來記住身分）
  const ID_NAME_MAP = {
    "596881FC68ACA83C": "阿華",
    "43ECF2955D2C6955": "小戴"
  };

  const NAME_LIST = Object.values(ID_NAME_MAP);

  // 簡單雜湊函式，把字串轉成穩定的 hex 值
  function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const chr = str.charCodeAt(i);
      hash = (hash << 5) - hash + chr;
      hash |= 0; // 轉成 32bit 整數
    }
    return Math.abs(hash).toString(16);
  }

  // 用瀏覽器 / 裝置特徵組成指紋，作為第一次產生 ID 的種子
  // 注意：這只能在「同一台裝置的同一個瀏覽器」保持一致，
  // 無法做到跨瀏覽器或換瀏覽器仍是同一組 ID（純前端技術上的限制）。
  function getDeviceFingerprint() {
    const parts = [];

    parts.push(navigator.userAgent || "");
    parts.push(navigator.language || "");
    parts.push(String(screen.width) + "x" + String(screen.height));
    parts.push(String(screen.colorDepth || ""));
    parts.push(String(new Date().getTimezoneOffset()));
    parts.push(String(navigator.hardwareConcurrency || ""));

    // Canvas 指紋：不同顯示卡/字型渲染會產生些微差異，增加穩定的獨特性
    try {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillText("device-fingerprint-🔒", 2, 2);
      parts.push(canvas.toDataURL());
    } catch (e) {
      parts.push("no-canvas");
    }

    return parts.join("||");
  }

  function generateDeviceId() {
    const fingerprint = getDeviceFingerprint();
    const hash1 = hashString(fingerprint);
    const hash2 = hashString(fingerprint.split("").reverse().join(""));
    return (hash1 + hash2).toUpperCase().slice(0, 16);
  }

  function getOrCreateDeviceId() {
    let id = localStorage.getItem(STORAGE_KEY);
    if (!id) {
      id = generateDeviceId();
      localStorage.setItem(STORAGE_KEY, id);
    }
    return id;
  }

  const deviceId = getOrCreateDeviceId();
  document.getElementById("deviceIdDisplay").textContent = deviceId;

  const nameEl = document.getElementById("nameDisplay");
  const pickerEl = document.getElementById("namePicker");
  const changeLinkEl = document.getElementById("changeLink");
  const buttonListEl = document.getElementById("nameButtonList");

  function showName(name) {
    nameEl.textContent = name;
    nameEl.classList.remove("unknown", "hidden");
    pickerEl.classList.remove("show");
    changeLinkEl.classList.remove("hidden");
  }

  function showUnknown() {
    nameEl.textContent = "未登記的裝置";
    nameEl.classList.add("unknown");
    nameEl.classList.remove("hidden");
    pickerEl.classList.remove("show");
    changeLinkEl.classList.remove("hidden");
  }

  function showPicker() {
    buttonListEl.innerHTML = "";
    NAME_LIST.forEach(function (name) {
      const btn = document.createElement("button");
      btn.className = "name-btn";
      btn.textContent = name;
      btn.onclick = function () { assignName(name); };
      buttonListEl.appendChild(btn);
    });
    nameEl.classList.add("hidden");
    changeLinkEl.classList.add("hidden");
    pickerEl.classList.add("show");
  }

  function assignName(name) {
    localStorage.setItem(NAME_STORAGE_KEY, name);
    showName(name);
  }

  window.skipName = function () {
    localStorage.setItem(NAME_STORAGE_KEY, SKIPPED_VALUE);
    showUnknown();
  };

  window.resetName = function () {
    localStorage.removeItem(NAME_STORAGE_KEY);
    showPicker();
  };

  // 判斷順序：
  // 1. 這個瀏覽器之前選過名字 → 直接顯示
  // 2. 之前選過「跳過」→ 顯示未登記
  // 3. 裝置 ID 剛好對得到名單（例如同一瀏覽器再次造訪）→ 直接顯示並記住
  // 4. 都沒有 → 顯示選擇畫面，讓使用者選一次
  const savedName = localStorage.getItem(NAME_STORAGE_KEY);
  if (savedName === SKIPPED_VALUE) {
    showUnknown();
  } else if (savedName) {
    showName(savedName);
  } else if (ID_NAME_MAP[deviceId]) {
    assignName(ID_NAME_MAP[deviceId]);
  } else {
    showPicker();
  }

  window.copyId = function () {
    navigator.clipboard.writeText(deviceId).then(() => {
      const btn = document.querySelector(".copy-btn");
      const original = btn.textContent;
      btn.textContent = "已複製 ✓";
      setTimeout(() => (btn.textContent = original), 1500);
    });
  };

  // 方便其他程式碼取用
  window.DEVICE_ID = deviceId;
})();
</script>

</body>
</html>
