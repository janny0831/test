<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進貨作業管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f2f0ea;
    --bg-elevated:#fbfaf7;
    --surface:#ffffff;
    --surface-2:#f5f3ee;
    --border:#dcd8ce;
    --border-soft:#e8e5dc;
    --text:#1e2128;
    --text-dim:#666f7d;
    --text-faint:#9aa2ae;
    --accent:#b8712f;
    --accent-soft:#f2e2cd;
    --accent-glow:rgba(184,113,47,0.15);
    --jade:#317a63;
    --jade-soft:#dcece5;
    --danger:#a83f32;
    --danger-soft:#f2ddd9;
    --amber:#a68626;
    --amber-soft:#f0e8cf;
    --radius:10px;
    --shadow:0 8px 24px rgba(30,20,10,0.08);
    --font-display:'IBM Plex Mono',monospace;
    --font-body:'Noto Sans TC','IBM Plex Mono',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    background-image:
      linear-gradient(var(--border-soft) 1px,transparent 1px),
      linear-gradient(90deg,var(--border-soft) 1px,transparent 1px);
    background-size:48px 48px;
    background-position:-1px -1px;
  }

  ::selection{background:var(--accent);color:#fff;}

  .app{max-width:1280px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:46px;height:46px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent),#a8632c);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;color:#fff;font-size:18px;
    box-shadow:0 4px 14px var(--accent-glow);
    flex-shrink:0;
  }
  .brand-text .eyebrow{
    font-family:var(--font-display);font-size:11px;letter-spacing:0.16em;
    color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;
  }
  .brand-text h1{font-size:22px;font-weight:700;letter-spacing:-0.01em;}
  .header-actions{display:flex;gap:10px;align-items:center;}

  .icon-btn{
    width:40px;height:40px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transition:all .2s ease;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* Tabs */
  .tabs{
    display:flex;gap:4px;margin-bottom:24px;overflow-x:auto;
    border-bottom:1px solid var(--border);padding-bottom:0;
  }
  .tab-btn{
    font-family:var(--font-body);font-size:14px;font-weight:600;
    padding:12px 18px;background:none;border:none;color:var(--text-dim);
    cursor:pointer;white-space:nowrap;position:relative;
    border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .2s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-panel{display:none;animation:fadeIn .25s ease;}
  .tab-panel.active{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Cards / Sections */
  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .card-title{
    font-size:17px;font-weight:700;margin-bottom:16px;display:flex;
    align-items:center;gap:8px;
  }
  .card-title .tag{
    font-family:var(--font-display);font-size:10px;color:var(--accent);
    background:var(--accent-soft);padding:2px 8px;border-radius:20px;
    letter-spacing:0.05em;
  }

  /* Dashboard summary - single glance table */
  .summary-table-wrap{overflow-x:auto;}
  .summary-table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px;}
  .summary-table thead th{
    font-family:var(--font-display);font-size:13px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.04em;font-weight:600;
    padding:0 10px 14px;text-align:center;white-space:nowrap;
  }
  .summary-table thead th:first-child{text-align:left;}
  .summary-table tbody tr{background:var(--surface);}
  .summary-table tbody td{
    padding:18px 10px;text-align:center;border-top:1px solid var(--border-soft);
    border-bottom:1px solid var(--border-soft);
  }
  .summary-table tbody tr td:first-child{
    text-align:left;border-left:6px solid var(--item-color,var(--accent));
    border-radius:8px 0 0 8px;padding-left:18px;
  }
  .summary-table tbody tr td:last-child{border-radius:0 8px 8px 0;padding-right:18px;}
  .summary-table tbody tr{box-shadow:var(--shadow);}
  .summary-table tbody tr + tr{margin-top:10px;}
  .summary-table tbody{display:table-row-group;}
  .summary-table tr{display:table;width:100%;table-layout:fixed;}
  .sum-item-name{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:0.01em;}
  .sum-item-cat{font-size:12px;color:var(--text-faint);font-weight:600;margin-top:2px;}
  .sum-num{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;}
  .sum-num.danger{color:var(--danger);}
  .sum-num.jade{color:var(--jade);}
  .sum-num.amber{color:var(--amber);}
  .sum-num.zero{color:var(--text-faint);}
  .sum-progress{width:120px;margin:0 auto;}
  .sum-progress .progress-track{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;}
  .sum-progress .progress-fill{height:100%;border-radius:5px;}
  .sum-progress .progress-fill.delivered{background:var(--accent);}
  .sum-progress .progress-fill.completed{background:var(--jade);}
  .sum-progress .progress-fill.ng{background:var(--danger);}
  .sum-progress-pct{font-family:var(--font-display);font-size:13px;font-weight:700;margin-top:6px;color:var(--text-dim);}
  @media(max-width:640px){
    .sum-item-name{font-size:21px;}
    .sum-num{font-size:24px;}
  }

  /* Forms */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--text-dim);
    margin-bottom:6px;letter-spacing:0.02em;
  }
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font-body);
    font-size:14px;transition:border-color .2s ease;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--accent);
  }
  .field textarea{resize:vertical;min-height:40px;}
  .field.full{grid-column:1/-1;}
  .form-actions{margin-top:18px;display:flex;gap:10px;}

  .btn{
    font-family:var(--font-body);font-weight:600;font-size:14px;
    padding:11px 22px;border-radius:8px;border:none;cursor:pointer;
    transition:all .2s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#c17d3a;transform:translateY(-1px);}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-danger-ghost{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn-danger-ghost:hover{background:var(--danger-soft);}
  .btn-sm{padding:6px 12px;font-size:12px;}

  /* Table */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-family:var(--font-display);font-size:11px;
    color:var(--text-dim);text-transform:uppercase;letter-spacing:0.05em;
    padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  tbody tr:hover{background:var(--surface-2);}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
    font-weight:600;font-family:var(--font-display);
  }
  .pill.demand{background:var(--surface-2);color:var(--text-dim);}
  .pill.incoming{background:var(--accent-soft);color:var(--accent);}
  .pill.completed{background:var(--jade-soft);color:var(--jade);}
  .pill.ng{background:var(--danger-soft);color:var(--danger);}
  .note-cell{color:var(--text-dim);font-size:12px;max-width:200px;}
  .del-btn{
    background:none;border:none;color:var(--text-faint);cursor:pointer;
    font-size:16px;padding:2px 6px;border-radius:4px;transition:all .15s ease;
  }
  .del-btn:hover{color:var(--danger);background:var(--danger-soft);}
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--text-faint);font-size:13px;
  }

  /* Filter bar */
  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .filter-bar .field{min-width:150px;}

  .view-switch{display:flex;gap:8px;margin-bottom:18px;}
  .view-switch-btn{
    font-family:var(--font-body);font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);cursor:pointer;
    transition:all .2s ease;
  }
  .view-switch-btn:hover{border-color:var(--accent);color:var(--text);}
  .view-switch-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* Matrix table (date x item, spreadsheet style) */
  .matrix-table{width:100%;border-collapse:collapse;font-size:15px;}
  .matrix-table th,.matrix-table td{border:1px solid var(--border);padding:10px 12px;text-align:center;}
  .matrix-table thead th{
    background:var(--jade-soft);color:var(--text);font-weight:700;
    font-family:var(--font-display);font-size:14px;white-space:nowrap;
  }
  .matrix-table thead tr.matrix-head-top th{background:var(--jade-soft);}
  .matrix-table tbody td.mx-date{
    text-align:left;font-weight:600;white-space:nowrap;font-family:var(--font-display);
  }
  .matrix-table tbody td.mx-weekday{color:var(--text-faint);font-size:12px;padding-left:4px;}
  .matrix-table tbody td.mx-num{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .matrix-table tbody td.mx-num.zero{color:var(--text-faint);font-weight:400;}
  .matrix-table tbody td.mx-note{text-align:left;font-size:12px;color:var(--text-dim);max-width:260px;}
  .matrix-table tbody tr:hover td{background:var(--surface-2);}
  .matrix-table tfoot td{
    background:var(--amber-soft);font-weight:700;font-family:var(--font-display);
    color:var(--text);border-top:2px solid var(--amber);
  }
  .matrix-table tfoot td.mx-date{text-align:left;}

  /* Demand batches inside summary table */
  .demand-batch-list{
    display:flex;flex-direction:column;gap:6px;max-height:120px;overflow-y:auto;
    padding-right:2px;
  }
  .demand-batch{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:6px;
    padding:5px 10px;
  }
  .demand-batch.urgent{
    background:var(--danger-soft);border-color:var(--danger);
  }
  .demand-batch.urgent .dbatch-qty{color:var(--danger);}
  .demand-batch.urgent .dbatch-date{color:var(--danger);font-weight:700;}
  .dbatch-qty{font-family:var(--font-display);font-size:17px;font-weight:700;}
  .dbatch-date{font-size:12px;color:var(--text-faint);white-space:nowrap;font-weight:600;}
  .demand-total{
    margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
    font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text-dim);
    display:flex;justify-content:space-between;
  }
  .demand-total b{color:var(--text);font-size:16px;}
  .demand-empty{color:var(--text-faint);font-size:13px;}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface);border:1px solid var(--accent);color:var(--text);
    padding:12px 22px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;
    font-weight:600;opacity:0;pointer-events:none;transition:all .3s ease;z-index:100;
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);}

  .backup-row{display:flex;gap:12px;flex-wrap:wrap;}
  .hint-text{font-size:12px;color:var(--text-faint);margin-top:8px;line-height:1.6;}

  @media(max-width:640px){
    header{flex-direction:column;align-items:flex-start;}
    .brand-text h1{font-size:18px;}
    .card{padding:16px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-mark">進</div>
      <div class="brand-text">
        <div class="eyebrow">Incoming Goods Tracker</div>
        <h1>進貨作業管理系統</h1>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="exportBtn" title="匯出 Excel">⬇</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">📊 總覽儀表板</button>
    <button class="tab-btn" data-tab="demand">📝 需求登記</button>
    <button class="tab-btn" data-tab="incoming">📦 進貨登記</button>
    <button class="tab-btn" data-tab="completed">✅ 完成登記</button>
    <button class="tab-btn" data-tab="ng">⚠️ NG登記</button>
    <button class="tab-btn" data-tab="records">📋 明細記錄</button>
    <button class="tab-btn" data-tab="settings">⚙️ 資料管理</button>
  </div>

  <!-- Dashboard -->
  <div class="tab-panel active" id="panel-dashboard">
    <div class="card">
      <div class="card-title">品項總結表 <span class="tag">LIVE</span></div>
      <div class="summary-table-wrap">
        <table class="summary-table">
          <thead>
            <tr>
              <th>品項</th>
              <th>需求數量（依批次）</th>
              <th>還欠數量</th>
              <th>已進貨</th>
              <th>已完成</th>
              <th>未測半成品剩餘</th>
              <th>NG 數量</th>
              <th>供應商已交貨</th>
              <th>作業已完成</th>
              <th>NG 率</th>
              <th>日均完成量</th>
            </tr>
          </thead>
          <tbody id="summaryGrid"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Demand -->
  <div class="tab-panel" id="panel-demand">
    <div class="card">
      <div class="card-title">新增需求</div>
      <form id="demandForm" class="form-grid">
        <div class="field">
          <label>品項</label>
          <select name="item" required></select>
        </div>
        <div class="field">
          <label>需求數量</label>
          <input type="number" name="qty" min="1" required placeholder="例如 500">
        </div>
        <div class="field">
          <label>需求完成時間</label>
          <input type="date" name="date" required>
        </div>
        <div class="field full">
          <label>備註</label>
          <textarea name="note" placeholder="選填"></textarea>
        </div>
        <div class="field full form-actions">
          <button type="submit" class="btn btn-primary">＋ 新增需求</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">需求紀錄</div>
      <div class="table-wrap" id="demandTable"></div>
    </div>
  </div>

  <!-- Incoming -->
  <div class="tab-panel" id="panel-incoming">
    <div class="card">
      <div class="card-title">新增進貨(未測半成品)</div>
      <form id="incomingForm" class="form-grid">
        <div class="field">
          <label>品項</label>
          <select name="item" required></select>
        </div>
        <div class="field">
          <label>進貨數量</label>
          <input type="number" name="qty" min="1" required placeholder="例如 300">
        </div>
        <div class="field">
          <label>進貨時間</label>
          <input type="date" name="date" required>
        </div>
        <div class="field full">
          <label>備註</label>
          <textarea name="note" placeholder="例如：數量不足 / 供應商延誤原因..."></textarea>
        </div>
        <div class="field full form-actions">
          <button type="submit" class="btn btn-primary">＋ 新增進貨</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">進貨紀錄</div>
      <div class="table-wrap" id="incomingTable"></div>
    </div>
  </div>

  <!-- Completed -->
  <div class="tab-panel" id="panel-completed">
    <div class="card">
      <div class="card-title">新增完成作業</div>
      <form id="completedForm" class="form-grid">
        <div class="field">
          <label>品項</label>
          <select name="item" required></select>
        </div>
        <div class="field">
          <label>完成數量</label>
          <input type="number" name="qty" min="1" required placeholder="例如 280">
        </div>
        <div class="field">
          <label>完成時間</label>
          <input type="date" name="date" required>
        </div>
        <div class="field">
          <label>花費工時（小時）</label>
          <input type="number" name="hours" min="0" step="0.5" placeholder="例如 4">
        </div>
        <div class="field full">
          <label>備註</label>
          <textarea name="note" placeholder="選填"></textarea>
        </div>
        <div class="field full form-actions">
          <button type="submit" class="btn btn-primary">＋ 新增完成紀錄</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">完成作業紀錄</div>
      <div class="table-wrap" id="completedTable"></div>
    </div>
  </div>

  <!-- NG -->
  <div class="tab-panel" id="panel-ng">
    <div class="card">
      <div class="card-title">新增 NG 產品</div>
      <form id="ngForm" class="form-grid">
        <div class="field">
          <label>品項</label>
          <select name="item" required></select>
        </div>
        <div class="field">
          <label>NG 類型</label>
          <select name="ngAction" required>
            <option value="release">放行（送回廠商）</option>
            <option value="return">回廠（廠商修復送回）</option>
          </select>
        </div>
        <div class="field">
          <label>NG 數量</label>
          <input type="number" name="qty" min="1" required placeholder="例如 5">
        </div>
        <div class="field">
          <label>發現時間</label>
          <input type="date" name="date" required>
        </div>
        <div class="field full">
          <label>備註</label>
          <textarea name="note" placeholder="例如：NG 原因..."></textarea>
        </div>
        <div class="field full form-actions">
          <button type="submit" class="btn btn-primary">＋ 新增 NG 紀錄</button>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="card-title">NG 產品紀錄</div>
      <div class="table-wrap" id="ngTable"></div>
    </div>
  </div>

  <!-- Records (all, filterable) -->
  <div class="tab-panel" id="panel-records">
    <div class="card">
      <div class="card-title">明細記錄篩選</div>
      <div class="view-switch">
        <button class="view-switch-btn active" data-view="list">📋 列表檢視</button>
        <button class="view-switch-btn" data-view="matrix">🗂 表格檢視（日期×品項）</button>
      </div>
      <div class="filter-bar">
        <div class="field" id="filterTypeWrap">
          <label>類型</label>
          <select id="filterType">
            <option value="">全部類型</option>
            <option value="demand">需求</option>
            <option value="incoming" selected>進貨</option>
            <option value="completed">完成</option>
            <option value="ng">NG</option>
          </select>
        </div>
        <div class="field" id="filterItemWrap">
          <label>品項</label>
          <select id="filterItem"><option value="">全部品項</option></select>
        </div>
        <div class="field">
          <label>起始日期</label>
          <input type="date" id="filterStart">
        </div>
        <div class="field">
          <label>結束日期</label>
          <input type="date" id="filterEnd">
        </div>
        <div class="field">
          <button class="btn btn-ghost" id="clearFilterBtn">清除篩選</button>
        </div>
      </div>
    </div>
    <div class="card" id="listViewCard">
      <div class="card-title">全部明細記錄</div>
      <div class="table-wrap" id="allRecordsTable"></div>
    </div>
    <div class="card" id="matrixViewCard" style="display:none;">
      <div class="card-title" id="matrixTitle">進貨紀錄表（日期 × 品項）</div>
      <div class="table-wrap" id="matrixTable"></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="tab-panel" id="panel-settings">
    <div class="card">
      <div class="card-title">資料備份與還原</div>
      <p class="hint-text">本系統資料儲存於瀏覽器本機(localStorage),清除瀏覽器快取或更換裝置將會遺失資料。建議定期匯出備份檔。</p>
      <div class="backup-row" style="margin-top:16px;">
        <button class="btn btn-ghost" id="backupBtn">⬇ 匯出備份 (JSON)</button>
        <button class="btn btn-ghost" id="restoreBtnTrigger">⬆ 匯入還原 (JSON)</button>
        <input type="file" id="restoreInput" accept=".json" style="display:none;">
        <button class="btn btn-danger-ghost" id="clearAllBtn">🗑 清除全部資料</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
/* ---------- 資料模型 ---------- */
const ITEMS = [
  {key:'KZIO', cat:'軸卡', color:'#d68c45'},
  {key:'CCD',  cat:'軸卡', color:'#c17d3a'},
  {key:'KYIO', cat:'軸卡', color:'#b8712f'},
  {key:'KQDR', cat:'軸卡', color:'#a8632c'},
  {key:'鑽針',  cat:'鑽針', color:'#4a9d84'},
];
const STORE_KEY = 'incoming_goods_system_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {demand:[], incoming:[], completed:[], ng:[]};
}
let DATA = loadData();
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const TYPE_LABEL = {demand:'需求', incoming:'進貨', completed:'完成', ng:'NG'};

/* ---------- 初始化下拉選單 ---------- */
function populateItemSelects(){
  document.querySelectorAll('select[name="item"]').forEach(sel=>{
    sel.innerHTML = ITEMS.map(it=>`<option value="${it.key}">${it.key}（${it.cat}）</option>`).join('');
  });
  const filterItem = document.getElementById('filterItem');
  filterItem.innerHTML = '<option value="">全部品項</option>' + ITEMS.map(it=>`<option value="${it.key}">${it.key}</option>`).join('');
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='dashboard') renderDashboard();
    if(btn.dataset.tab==='records'){ renderRecordsTable(); renderMatrixTable(); }
  });
});

/* ---------- Toast ---------- */
function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
}

/* ---------- 統計計算 ---------- */
function sumQty(list, item){
  return list.filter(r=>r.item===item).reduce((s,r)=>s+Number(r.qty),0);
}
function computeNgNet(itemKey){
  const net = DATA.ng.filter(r=>r.item===itemKey).reduce((s,r)=>{
    const q = Number(r.qty);
    return s + (r.ngAction==='return' ? -q : q);
  },0);
  return Math.max(net, 0);
}
function computeStats(itemKey){
  const demandQty = sumQty(DATA.demand, itemKey);
  const incomingQty = sumQty(DATA.incoming, itemKey);
  const completedQty = sumQty(DATA.completed, itemKey);
  const ngQty = computeNgNet(itemKey);
  const shortageQty = Math.max(demandQty - incomingQty, 0);
  const pendingQty = Math.max(incomingQty - completedQty - ngQty, 0); // 未測半成品剩餘
  const deliveredRate = demandQty>0 ? Math.min(incomingQty/demandQty,1)*100 : 0;
  const completedRate = demandQty>0 ? Math.min(completedQty/demandQty,1)*100 : 0;
  const ngRate = demandQty>0 ? Math.min(ngQty/demandQty,1)*100 : 0;

  // 日均完成量：依完成登記中填寫的工時換算（1天=8小時）
  const completedRecords = DATA.completed.filter(r=>r.item===itemKey);
  const totalHours = completedRecords.reduce((s,r)=> s + (Number(r.hours)||0), 0);
  const hoursQty = completedRecords.reduce((s,r)=> r.hours!==undefined && r.hours!==null && r.hours!=='' ? s+Number(r.qty) : s, 0);
  const totalDays = totalHours / 8;
  const avgPerDay = totalDays>0 ? hoursQty/totalDays : 0;

  return {demandQty, incomingQty, completedQty, ngQty, shortageQty, pendingQty, deliveredRate, completedRate, ngRate, avgPerDay, totalHours};
}

/* ---------- Dashboard ---------- */
function formatShortDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length!==3) return d;
  return `${Number(parts[1])}/${Number(parts[2])}`;
}

function daysUntil(dateStr){
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}

function renderDemandBatchCell(itemKey){
  const batches = DATA.demand.filter(r=>r.item===itemKey).sort((a,b)=>a.date.localeCompare(b.date));
  if(batches.length===0){
    return `<div class="demand-empty">尚無需求</div>`;
  }
  const total = batches.reduce((s,r)=>s+Number(r.qty),0);
  const listHtml = batches.map(r=>{
    const urgent = daysUntil(r.date) <= 3; // 3天內到期（含逾期）
    return `
    <div class="demand-batch${urgent?' urgent':''}">
      <span class="dbatch-qty">${r.qty}</span>
      <span class="dbatch-date">${formatShortDate(r.date)}</span>
    </div>`;
  }).join('');
  return `
    <div class="demand-batch-list">${listHtml}</div>
    <div class="demand-total"><span>合計</span><b>${total}</b></div>`;
}

function renderDashboard(){
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = ITEMS.map(it=>{
    const s = computeStats(it.key);
    const numCls = v => v===0 ? 'sum-num zero' : 'sum-num';
    return `
    <tr style="--item-color:${it.color}">
      <td>
        <div class="sum-item-name">${it.key}</div>
        <div class="sum-item-cat">${it.cat}</div>
      </td>
      <td style="text-align:left;">${renderDemandBatchCell(it.key)}</td>
      <td><div class="sum-num ${s.shortageQty>0?'danger':'zero'}">${s.shortageQty}</div></td>
      <td><div class="${numCls(s.incomingQty)}">${s.incomingQty}</div></td>
      <td><div class="sum-num ${s.completedQty>0?'jade':'zero'}">${s.completedQty}</div></td>
      <td><div class="sum-num ${s.pendingQty>0?'amber':'zero'}">${s.pendingQty}</div></td>
      <td><div class="sum-num ${s.ngQty>0?'danger':'zero'}">${s.ngQty}</div></td>
      <td>
        <div class="sum-progress">
          <div class="progress-track"><div class="progress-fill delivered" style="width:${s.deliveredRate}%"></div></div>
          <div class="sum-progress-pct">${s.deliveredRate.toFixed(0)}%</div>
        </div>
      </td>
      <td>
        <div class="sum-progress">
          <div class="progress-track"><div class="progress-fill completed" style="width:${s.completedRate}%"></div></div>
          <div class="sum-progress-pct">${s.completedRate.toFixed(0)}%</div>
        </div>
      </td>
      <td>
        <div class="sum-progress">
          <div class="progress-track"><div class="progress-fill ng" style="width:${s.ngRate}%"></div></div>
          <div class="sum-progress-pct">${s.ngRate.toFixed(0)}%</div>
        </div>
      </td>
      <td>
        <div class="sum-num ${s.avgPerDay>0?'jade':'zero'}" style="font-size:22px;">${s.avgPerDay>0?s.avgPerDay.toFixed(1):'—'}</div>
        ${s.avgPerDay>0?'<div class="sum-progress-pct">個/天</div>':''}
      </td>
    </tr>`;
  }).join('');
}

/* ---------- 表單處理 ---------- */
function setupForm(formId, type, tableRenderFn){
  const form = document.getElementById(formId);
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const rec = {
      id: uid(),
      item: fd.get('item'),
      qty: Number(fd.get('qty')),
      date: fd.get('date'),
      note: fd.get('note') || '',
      createdAt: new Date().toISOString()
    };
    if(fd.has('ngAction')) rec.ngAction = fd.get('ngAction');
    if(fd.has('hours') && fd.get('hours')!=='') rec.hours = Number(fd.get('hours'));
    DATA[type].push(rec);
    saveData();
    form.reset();
    tableRenderFn();
    renderDashboard();
    showToast('已新增一筆' + TYPE_LABEL[type] + '紀錄');
  });
}

function deleteRecord(type, id){
  if(!confirm('確定要刪除這筆紀錄嗎？')) return;
  DATA[type] = DATA[type].filter(r=>r.id!==id);
  saveData();
  renderAllTypeTables();
  renderDashboard();
  renderRecordsTable();
  renderMatrixTable();
  showToast('已刪除紀錄');
}

function renderTypeTable(type, containerId){
  const container = document.getElementById(containerId);
  const list = [...DATA[type]].sort((a,b)=> b.date.localeCompare(a.date));
  if(list.length===0){
    container.innerHTML = `<div class="empty-state">尚無紀錄</div>`;
    return;
  }
  const dateLabel = {demand:'需求完成時間', incoming:'進貨時間', completed:'完成時間', ng:'發現時間'}[type];
  const qtyLabel = {demand:'需求數量', incoming:'進貨數量', completed:'完成數量', ng:'NG數量'}[type];
  const ngActionLabel = {release:'放行', return:'回廠'};
  container.innerHTML = `
    <table>
      <thead><tr>
        <th>品項</th>${type==='ng'?'<th>類型</th>':''}<th>${qtyLabel}</th>${type==='completed'?'<th>工時（小時）</th>':''}<th>${dateLabel}</th><th>備註</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(r=>`
          <tr>
            <td><span class="pill ${type}">${r.item}</span></td>
            ${type==='ng'?`<td><span class="pill ${r.ngAction==='return'?'completed':'ng'}">${ngActionLabel[r.ngAction]||'放行'}</span></td>`:''}
            <td>${r.qty}</td>
            ${type==='completed'?`<td>${(r.hours!==undefined && r.hours!==null && r.hours!=='')?r.hours:'—'}</td>`:''}
            <td>${r.date}</td>
            <td class="note-cell">${escapeHtml(r.note)||'—'}</td>
            <td><button class="del-btn" onclick="deleteRecord('${type}','${r.id}')" title="刪除">✕</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderAllTypeTables(){
  renderTypeTable('demand','demandTable');
  renderTypeTable('incoming','incomingTable');
  renderTypeTable('completed','completedTable');
  renderTypeTable('ng','ngTable');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- 明細記錄（全部＋篩選） ---------- */
function renderRecordsTable(){
  const type = document.getElementById('filterType').value;
  const item = document.getElementById('filterItem').value;
  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;

  let all = [];
  ['demand','incoming','completed','ng'].forEach(t=>{
    DATA[t].forEach(r=> all.push({...r, type:t}));
  });

  all = all.filter(r=>{
    if(type && r.type!==type) return false;
    if(item && r.item!==item) return false;
    if(start && r.date < start) return false;
    if(end && r.date > end) return false;
    return true;
  });
  all.sort((a,b)=> b.date.localeCompare(a.date));

  const container = document.getElementById('allRecordsTable');
  if(all.length===0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的紀錄</div>`;
    return;
  }
  container.innerHTML = `
    <table>
      <thead><tr><th>類型</th><th>品項</th><th>數量</th><th>日期</th><th>備註</th><th></th></tr></thead>
      <tbody>
        ${all.map(r=>`
          <tr>
            <td><span class="pill ${r.type}">${TYPE_LABEL[r.type]}${r.type==='ng'?'・'+(r.ngAction==='return'?'回廠':'放行'):''}</span></td>
            <td>${r.item}</td>
            <td>${r.qty}</td>
            <td>${r.date}</td>
            <td class="note-cell">${escapeHtml(r.note)||'—'}</td>
            <td><button class="del-btn" onclick="deleteRecord('${r.type}','${r.id}')" title="刪除">✕</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}
['filterType','filterItem','filterStart','filterEnd'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>{
    renderRecordsTable();
    renderMatrixTable();
  });
});
document.getElementById('clearFilterBtn').addEventListener('click', ()=>{
  document.getElementById('filterType').value='';
  document.getElementById('filterItem').value='';
  document.getElementById('filterStart').value='';
  document.getElementById('filterEnd').value='';
  renderRecordsTable();
  renderMatrixTable();
});

/* ---------- 檢視切換 ---------- */
const WEEKDAY_CN = ['日','一','二','三','四','五','六'];
document.querySelectorAll('.view-switch-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.view-switch-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const isMatrix = btn.dataset.view==='matrix';
    document.getElementById('listViewCard').style.display = isMatrix ? 'none' : 'block';
    document.getElementById('matrixViewCard').style.display = isMatrix ? 'block' : 'none';
    if(isMatrix) renderMatrixTable();
  });
});

function renderMatrixTable(){
  const typeSel = document.getElementById('filterType');
  let type = typeSel.value;
  if(!type){ type = 'incoming'; } // 表格檢視需指定單一類型，預設進貨
  const item = document.getElementById('filterItem').value;
  const start = document.getElementById('filterStart').value;
  const end = document.getElementById('filterEnd').value;

  document.getElementById('matrixTitle').textContent = `${TYPE_LABEL[type]}紀錄表（日期 × 品項）`;

  let records = DATA[type].filter(r=>{
    if(item && r.item!==item) return false;
    if(start && r.date < start) return false;
    if(end && r.date > end) return false;
    return true;
  });

  const cols = item ? ITEMS.filter(it=>it.key===item) : ITEMS;

  // 依日期分組
  const byDate = {};
  records.forEach(r=>{
    if(!byDate[r.date]) byDate[r.date] = {};
    cols.forEach(c=>{ if(!(c.key in byDate[r.date])) byDate[r.date][c.key]=0; });
    const signedQty = (type==='ng' && r.ngAction==='return') ? -Number(r.qty) : Number(r.qty);
    byDate[r.date][r.item] = (byDate[r.date][r.item]||0) + signedQty;
    byDate[r.date]._notes = byDate[r.date]._notes || [];
    const noteText = type==='ng' ? `[${r.ngAction==='return'?'回廠':'放行'}]${r.note||''}` : r.note;
    if(r.note) byDate[r.date]._notes.push(noteText);
  });

  const dates = Object.keys(byDate).sort();
  const container = document.getElementById('matrixTable');

  if(dates.length===0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的紀錄</div>`;
    return;
  }

  const totals = {};
  cols.forEach(c=> totals[c.key]=0);

  let rowsHtml = dates.map(d=>{
    const row = byDate[d];
    const dObj = new Date(d+'T00:00:00');
    const wd = isNaN(dObj) ? '' : WEEKDAY_CN[dObj.getDay()];
    const cellsHtml = cols.map(c=>{
      const v = row[c.key]||0;
      totals[c.key]+=v;
      return `<td class="mx-num ${v===0?'zero':''}">${v===0?'':v}</td>`;
    }).join('');
    const noteText = (row._notes||[]).join('；');
    return `<tr>
      <td class="mx-date">${d}<span class="mx-weekday">（${wd}）</span></td>
      ${cellsHtml}
      <td class="mx-note">${escapeHtml(noteText)||''}</td>
    </tr>`;
  }).join('');

  const totalCells = cols.map(c=>`<td>${totals[c.key]}</td>`).join('');

  container.innerHTML = `
    <table class="matrix-table">
      <thead>
        <tr>
          <th>日期</th>
          ${cols.map(c=>`<th>${c.key}</th>`).join('')}
          <th>備註</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
      <tfoot>
        <tr>
          <td class="mx-date">總計</td>
          ${totalCells}
          <td></td>
        </tr>
      </tfoot>
    </table>`;
}

/* ---------- Excel 匯出 ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const wb = XLSX.utils.book_new();

  // 總結表
  const summaryRows = ITEMS.map(it=>{
    const s = computeStats(it.key);
    return {
      '品項': it.key, '分類': it.cat,
      '需求數量': s.demandQty, '還欠數量': s.shortageQty, '已進貨數量': s.incomingQty,
      '已完成數量': s.completedQty, '未測半成品剩餘': s.pendingQty, 'NG數量': s.ngQty,
      '已交貨率(%)': s.deliveredRate.toFixed(1), '已完成率(%)': s.completedRate.toFixed(1), 'NG率(%)': s.ngRate.toFixed(1),
      '日均完成量': s.avgPerDay>0 ? s.avgPerDay.toFixed(1) : ''
    };
  });
  const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, wsSummary, '總結表');

  const sheetMap = {demand:'需求登記', incoming:'進貨登記', completed:'完成登記', ng:'NG登記'};
  const dateLabelMap = {demand:'需求完成時間', incoming:'進貨時間', completed:'完成時間', ng:'發現時間'};
  const ngActionLabel = {release:'放行', return:'回廠'};
  Object.keys(sheetMap).forEach(type=>{
    const rows = DATA[type].map(r=>{
      const row = {'品項': r.item};
      if(type==='ng') row['類型'] = ngActionLabel[r.ngAction] || '放行';
      row['數量'] = r.qty;
      if(type==='completed') row['工時(小時)'] = (r.hours!==undefined && r.hours!==null && r.hours!=='') ? r.hours : '';
      row[dateLabelMap[type]] = r.date;
      row['備註'] = r.note;
      return row;
    });
    const emptyRow = type==='ng' ? {'品項':'','類型':'','數量':'','備註':''} : {'品項':'','數量':'','備註':''};
    const ws = XLSX.utils.json_to_sheet(rows.length? rows : [emptyRow]);
    XLSX.utils.book_append_sheet(wb, ws, sheetMap[type]);
  });

  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `進貨作業管理_${today}.xlsx`);
  showToast('已匯出 Excel 檔案');
});

/* ---------- 備份 / 還原 ---------- */
document.getElementById('backupBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `進貨系統備份_${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔');
});
document.getElementById('restoreBtnTrigger').addEventListener('click', ()=>{
  document.getElementById('restoreInput').click();
});
document.getElementById('restoreInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed.demand || !parsed.incoming || !parsed.completed || !parsed.ng){
        alert('檔案格式不正確');
        return;
      }
      if(!confirm('匯入將覆蓋目前所有資料，確定繼續嗎？')) return;
      DATA = parsed;
      saveData();
      renderAllTypeTables();
      renderDashboard();
      renderRecordsTable();
      renderMatrixTable();
      showToast('資料已還原');
    }catch(err){
      alert('讀取檔案失敗：'+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if(!confirm('這將清除所有資料且無法復原，確定嗎？')) return;
  if(!confirm('請再次確認：真的要清除全部資料嗎？')) return;
  DATA = {demand:[], incoming:[], completed:[], ng:[]};
  saveData();
  renderAllTypeTables();
  renderDashboard();
  renderRecordsTable();
  renderMatrixTable();
  showToast('已清除全部資料');
});

/* ---------- 初始化 ---------- */
populateItemSelects();
setupForm('demandForm','demand', ()=>renderTypeTable('demand','demandTable'));
setupForm('incomingForm','incoming', ()=>renderTypeTable('incoming','incomingTable'));
setupForm('completedForm','completed', ()=>renderTypeTable('completed','completedTable'));
setupForm('ngForm','ng', ()=>renderTypeTable('ng','ngTable'));
renderAllTypeTables();
renderDashboard();
renderRecordsTable();
renderMatrixTable();
</script>
</body>
</html>
